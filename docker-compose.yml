services:
  # ---------------------------------------------------------------------------
  # 1. Python AI / ML Microservice (FastAPI + XGBoost + LightGBM)
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: dairyfarm-ai-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 2. Node.js Express Backend API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dairyfarm-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=*
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. React SPA Frontend (Nginx Production Bundle)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dairyfarm-frontend
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
